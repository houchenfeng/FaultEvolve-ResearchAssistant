<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">FaultEvolve</title>
  <desc id="desc">按原始 PNG 比例描摹的演化树、故障脉冲与上升箭头。</desc>
  <defs>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="230" y1="450" x2="820" y2="690">
      <stop stop-color="#0079df"/><stop offset=".5" stop-color="#0075dc"/><stop offset="1" stop-color="#006dd1"/>
    </linearGradient>
    <linearGradient id="green" gradientUnits="userSpaceOnUse" x1="600" y1="460" x2="1075" y2="220">
      <stop stop-color="#08aca1"/><stop offset=".55" stop-color="#0ca38f"/><stop offset="1" stop-color="#0c9e8b"/>
    </linearGradient>
    <radialGradient id="node" gradientUnits="userSpaceOnUse" cx="885" cy="742" r="230">
      <stop stop-color="#0bab94"/><stop offset="1" stop-color="#0c9f8e"/>
    </radialGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#fafbfc"/>
    </linearGradient>
  </defs>
  <!-- Pulse sits behind the growth arrow and merges into the left node. -->
  <path d="M487 354H617L653 315L688 381L744 219L787 355L821 319H948"
        fill="none" stroke="#0077de" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
