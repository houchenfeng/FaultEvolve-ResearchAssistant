    H582 C645 700 680 683 718 631
    C751 586 790 567 838 567
    C918 567 982 633 982 713
    C982 795 921 860 840 860
    C795 860 760 840 725 803
    C690 765 667 746 611 746
    H497 C437 746 409 766 409 817
    C409 856 421 878 453 902
    C499 936 526 973 526 1021
    C526 1102 461 1167 378 1167
    C297 1167 231 1102 231 1021
    C231 970 258 932 306 898
    C334 878 344 855 344 820
    V628 C344 592 334 574 306 555
    C254 521 226 481 226 431
    C226 344 294 273 379 273Z"/>
