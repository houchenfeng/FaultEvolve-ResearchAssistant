# 三岛正式运行配置；冒烟测试通过命令行 -n 3 覆盖轮数。
budget:
  max_iterations: 150
  max_tokens: null
  max_wall_hours: null
  stage_caps: {}
  stagnation_window: 0
  tokens_per_point_cap: null
  min_iterations_before_stop: 150
  safety_factor: 1.5
  expand_gating: false
  cost_window: 5
selection:
  policy: uct
  c_puct: 1.2
  kappa_noise: 1.0
  lambda_dup: 0.1
  value:
    mode: scalar
    lambda_rank: 0.3
    lambda_noise: 1.0
    backup: max
    elite_m: 3
    elite_prob: 0.2
widening:
  C: 2.0
  alpha: 0.5
operators:
  bandit: false
  enabled:
  - refine
  - recall_focus
  - threshold_calibrate
  - inject
  min_explore: 0.1
  prior_alpha: 1.0
  prior_beta: 1.0
  fn_keywords: false
  fn_keyword_groups: 3
insights:
  top_k_foreign: 3
  top_k_negative: 3
  summarize_every: 5
  top_k_branch_memory: 5
stop:
  target_score: 33.7
  stop_at_target: false
  window: 15
  improve_rate_q90: 0.05
  continue_prob: 0.2
judge:
  provider: none
  base_url: https://miyang.cn/api/v1/decisions
  api_key_env: MIYANG_API_KEY
  model: miyang/jev-1.13
  timeout_s: 5.0
  prescreen: false
  invalid_threshold: 0.85
  low_value_threshold: 0.15
  low_value_action: skip
  defer_flush_evals: 0
  warmup: 10
  audit_rate: 0.1
  prior: true
  prior_tau: 0.5
  max_calls: 500
  max_consecutive_errors: 3
  max_state_chars: 6000
  retries: 0
  calibration_window: 30
  initial_trust: 0.5
llm:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  generate_model: qwen3.8-flash
  reason_model: qwen3.8-flash
  max_concurrency: 4
  temperature: 0.7
  max_tokens: 8000
  stream: true
  timeout_s: 3600
reflection:
  design_delta_factor: 1.0
  hypothesis_delta_factor: 2.0
  max_repair_attempts: 1
knowledge:
  dir: knowledge
  k: 4
  max_per_category: 2
analysis:
  enabled: false
  top_k: 3
  on_new_best: true
  dev_late_fraction: 0.4
  timeout_s: 600
  min_group_count: 10
seed: 20260926
islands:
  enabled: true
  exchange_interval: 5
  max_positive_per_exchange: 1
  max_negative_per_exchange: 2
  max_summaries_in_context: 3
  eval_concurrency: 1
  min_valid_evals_before_stall: 10
  stall_valid_evals: 15
  infra_fail_pause: 5
  stagnation_request_evals: 10
  early_error_share: true
  islands:
  - island_id: a
    profile: performance
    focus: 'Overall performance: maximize the composite task score, ranking quality,
      and diversity of feature/model structures.'
    operator_bias:
    - refine
    - inject
    knowledge_keywords:
    - temporal pattern
    - nonlinear
    - model family
    - feature interaction
    max_attempts: 50
    exploration_ratio: 0.2
  - island_id: b
    profile: miss_alert
    focus: 'Missed vs false alarms: maximize recall under a low false-alarm constraint,
      study error case structure and threshold calibration.'
    operator_bias:
    - recall_focus
    - threshold_calibrate
    knowledge_keywords:
    - imbalanced learning
    - hard positives
    - threshold calibration
    - grouped errors
    max_attempts: 50
    exploration_ratio: 0.2
  - island_id: c
    profile: efficiency
    focus: 'Efficiency and robustness: reduce runtime and model complexity, prefer
      sparse features and lightweight models, stay robust to missing data.'
    operator_bias:
    - refine
    - inject
    knowledge_keywords:
    - redundant features
    - lightweight model
    - stability
    - simplification
    max_attempts: 50
    exploration_ratio: 0.2
