# FaultEvolve configuration for HDD failure prediction benchmark
# Full autotune run profile (see docs/plans/AUTOTUNE_FULL_RUN_PLAN_2026-10-03.md §3)

budget:
  max_iterations: 10
  max_tokens: 150000
  max_wall_hours: 6
  stage_caps: {}
  stagnation_window: 0
  tokens_per_point_cap: null
  min_iterations_before_stop: 5
  safety_factor: 1.5
  expand_gating: false
  cost_window: 5

selection:
  policy: uct
  c_puct: 1.2
  kappa_noise: 1.0
  lambda_dup: 0.1
  value:
    mode: scalar
    lambda_rank: 0.3
    lambda_noise: 1.0
    backup: max
    elite_m: 3
    elite_prob: 0.2

widening:
  C: 2.0
  alpha: 0.5

operators:
  bandit: false
  enabled: [refine]
  min_explore: 0.1
  prior_alpha: 1.0
  prior_beta: 1.0
  fn_keywords: false
  fn_keyword_groups: 3
  crossover:
    enabled: false

insights:
  top_k_foreign: 3
  top_k_negative: 3
  summarize_every: 5
  top_k_branch_memory: 5

stop:
  target_score: 33.7
  stop_at_target: false
  window: 15
  improve_rate_q90: 0.05
  continue_prob: 0.2

judge:
  provider: none
  base_url: https://miyang.cn/api/v1/decisions
  api_key_env: MIYANG_API_KEY
  model: miyang/jev-1.13
  timeout_s: 5.0
  prescreen: false
  invalid_threshold: 0.85
  low_value_threshold: 0.15
  low_value_action: skip
  defer_flush_evals: 0
  warmup: 10
  audit_rate: 0.1
  prior: true
  prior_tau: 0.5
  max_calls: 500
  max_consecutive_errors: 3
  max_state_chars: 6000
  retries: 0
  calibration_window: 30
  initial_trust: 0.5

llm:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  generate_model: qwen3-coder-plus
  reason_model: qwen3-max
  max_concurrency: 4
  temperature: 0.7
  max_tokens: 8000

reflection:
  design_delta_factor: 1.0
  hypothesis_delta_factor: 2.0
  max_repair_attempts: 1

knowledge:
  dir: knowledge
  k: 4
  max_per_category: 2

analysis:
  enabled: false
  top_k: 3
  on_new_best: true
  dev_late_fraction: 0.4
  timeout_s: 600
  min_group_count: 10

discovery:
  enabled: false
  tournament:
    enabled: false

seed: 20260926

autotune:
  ledger:
    enabled: true
    full_eval_cap: 24
  hpo:
    enabled: true
    families: [logreg, lightgbm]
    search: random
    trials_per_structure: 8
    max_fits_total: 80
    promote_top_k: 1
  patch:
    enabled: true
    fallback: draft
  feedback:
    enabled: true
  quota:
    enabled: true
    shares:
      hpo: 3
      patch: 5
      draft: 2
